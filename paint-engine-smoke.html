<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JS Paint Engine Check</title><style>:root{color-scheme:dark;font:14px/1.5 system-ui;background:#10131c;color:#e4eaf4}body{margin:0}header{padding:16px 24px;border-bottom:1px solid #39435a}h1{font-size:18px;margin:0}p{margin:8px 0}a{color:#9dbdff}iframe{display:block;width:100%;height:78vh;border:0;background:#fff}#status{white-space:pre-wrap}button{font:inherit;padding:8px 12px;cursor:pointer}</style></head><body><header><h1>JS Paint Engine Check</h1><p>Standalone engine check only. This is not a Paint workspace and does not expose agent tools.</p><p id="status" role="status">Checking vendored engine…</p><button id="reload">Reload engine</button> <a href="./workspace-preview.html">Back to Playground preview</a></header><div id="host"></div><script type="module">
const status=document.getElementById('status'),host=document.getElementById('host');
let generation=0,timer;
async function load(){const current=++generation;clearTimeout(timer);host.replaceChildren();status.textContent='Checking vendored engine…';try{const response=await fetch('./vendor/jspaint/UPSTREAM.txt',{cache:'no-store'});if(!response.ok)throw new Error('Vendored engine is not available yet. Check the Vendor pinned JS Paint workflow.');const info=await response.text();if(current!==generation)return;if(!info.includes('53be67ab8c47cc0d2168899e7481bc04839c4c81'))throw new Error('Unexpected vendor revision.');const frame=document.createElement('iframe');frame.title='Vendored JS Paint engine';frame.src='./vendor/jspaint/index.html';frame.addEventListener('load',()=>{if(current!==generation)return;clearTimeout(timer);status.textContent='Engine document loaded. Manually verify the canvas, tools, menus, drawing and undo/redo; document load alone does not prove engine readiness.'});host.append(frame);timer=setTimeout(()=>{if(current===generation)status.textContent='Engine loading is taking longer than expected. Check browser Console and Network for missing assets.'},20000)}catch(error){if(current===generation)status.textContent=error.message}}
document.getElementById('reload').onclick=load;load();
</script></body></html>
