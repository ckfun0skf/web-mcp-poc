name: Paint browser regression (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/paint-test" --ignore-scripts --no-audit --no-fund playwright@1.56.0
          node "$RUNNER_TEMP/paint-test/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Run manual browser regression
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/paint-test/node_modules/playwright
        run: |
          set -euo pipefail
          test -s vendor/jspaint/index.html
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/paint-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/paint-regression.html > /dev/null; then break; fi
            sleep 1
          done
          node scripts/run-paint-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paint-browser-regression
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
