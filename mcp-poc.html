<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>MCP Textarea PoC</title>
  <style>
    body { max-width: 800px; margin: 40px auto; padding: 0 20px; font: 16px/1.6 system-ui, sans-serif; }
    textarea, input { box-sizing: border-box; width: 100%; padding: 10px; font: inherit; }
    textarea { min-height: 240px; }
    button { margin: 10px 8px 10px 0; padding: 8px 16px; }
    pre { background: #eee; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>MCP Textarea PoC</h1>
  <p>按允許後，持有專屬 MCP URL 嘅人可覆寫或追加此 textarea。只用假資料，唔好分享 URL。連線最多一小時，關閉頁面或按停止可停止寫入。</p>
  <p id="status" role="status">未授權</p>
  <button id="connect" type="button">允許 AI 寫入</button>
  <button id="stop" type="button" disabled>停止 AI 寫入</button>
  <p><label for="mcp-url">專屬 MCP URL（當作密碼）</label></p>
  <input id="mcp-url" readonly autocomplete="off" placeholder="連接成功後顯示">
  <button id="copy" type="button" disabled>複製 MCP URL</button>
  <p>ChatGPT 設定：名稱 Textarea PoC；身份驗證選「無」。貼上此 URL 後保持頁面開住。</p>
  <label for="editor">AI 寫入區</label>
  <textarea id="editor" placeholder="喺 ChatGPT 要求使用 write_text 寫入 Hello"></textarea>
  <h2>執行紀錄</h2>
  <pre id="log" aria-live="polite"></pre>
  <script>
    'use strict';
    const BASE = 'https://web-mcp-poc-relay.ckfun0skf.workers.dev';
    const editor = document.querySelector('#editor');
    const status = document.querySelector('#status');
    const connect = document.querySelector('#connect');
    const stop = document.querySelector('#stop');
    const copy = document.querySelector('#copy');
    const output = document.querySelector('#mcp-url');
    const logs = document.querySelector('#log');
    let socket = null;
    let generation = 0;
    let expiryTimer = null;
    const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    function log(text) { logs.textContent = [`[${new Date().toLocaleTimeString()}] ${text}`, ...logs.textContent.split('\n')].slice(0, 100).join('\n'); }
    function halt(reason) {
      generation++;
      clearTimeout(expiryTimer);
      const previous = socket;
      socket = null;
      previous?.close(1000, 'Authorization stopped');
      output.value = '';
      connect.disabled = false;
      stop.disabled = true;
      copy.disabled = true;
      status.textContent = reason;
      log(reason);
    }
    connect.addEventListener('click', async () => {
      const current = ++generation;
      connect.disabled = true;
      stop.disabled = false;
      status.textContent = '連接中…';
      try {
        const key = hex(crypto.getRandomValues(new Uint8Array(32)));
        const control = hex(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(key))));
        if (generation !== current) return;
        const ws = new WebSocket(`${BASE.replace('https:', 'wss:')}/browser?key=${key}`);
        socket = ws;
        ws.onmessage = event => {
          if (socket !== ws || generation !== current) return;
          try {
            const message = JSON.parse(event.data);
            if (message.type === 'ready') {
              output.value = `${BASE}/mcp/${control}`;
              copy.disabled = false;
              status.textContent = '已允許 AI 寫入，請設定 ChatGPT';
              expiryTimer = setTimeout(() => halt('一小時授權已到期'), Math.max(0, message.expiresAt - Date.now()));
              log('Browser 已連接；專屬 URL 只顯示於上方欄位');
            } else if (message.type === 'write_text' && typeof message.id === 'string') {
              try {
                if (typeof message.text !== 'string' || message.text.length > 20000 || !['replace', 'append'].includes(message.mode)) throw new Error('Invalid command');
                const next = message.mode === 'append' ? editor.value + message.text : message.text;
                if (next.length > 100000) throw new Error('Text limit exceeded');
                editor.value = next;
                editor.dispatchEvent(new Event('input', { bubbles: true }));
                ws.send(JSON.stringify({ type: 'write_result', id: message.id, success: true, totalLength: next.length }));
                log(`write_text 已執行並回報 browser acknowledgement：${message.mode}，寫入長度 ${message.text.length}`);
              } catch {
                ws.send(JSON.stringify({ type: 'write_result', id: message.id, success: false }));
                log('寫入被頁面拒絕');
              }
            }
          } catch { log('收到無效訊息'); }
        };
        ws.onerror = () => { if (socket === ws) log('連線錯誤，請確認 Cloudflare 已部署新版本'); };
        ws.onclose = () => { if (socket === ws) halt('已斷線；重新連接會產生新 MCP URL'); };
      } catch { if (generation === current) halt('連接失敗'); }
    });
    stop.addEventListener('click', () => halt('已停止 AI 寫入'));
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(output.value); log('已複製；請只貼到 ChatGPT 伺服器網址欄'); }
      catch { output.select(); log('請手動複製上方 URL'); }
    });
    log('未連線；需由用戶按允許後才接受寫入');
  </script>
</body>
</html>
